name: llm-reveal-examples

# Full-logging re-run for the blog (issue #9): a few clues, a few models, and for
# every reveal step the model's complete visible reply (no reasoning_effort, so the
# word-solver prompt's "reason briefly, then answer" text is captured).
# Manual only: Actions tab -> Run workflow. Commits research/llm_reveal/examples/.

on:
  workflow_dispatch:
    inputs:
      models:
        description: "models to run (space separated); empty = a weak + two strong"
        default: ""

concurrency:
  group: llm-reveal-examples-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write

env:
  OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
  OPENAI_BASE_URL: ${{ vars.OPENAI_BASE_URL || secrets.OPENAI_BASE_URL }}
  ANTHROPIC_BASE_URL: ${{ vars.ANTHROPIC_BASE_URL || secrets.ANTHROPIC_BASE_URL }}
  GOOGLE_BASE_URL: ${{ vars.GOOGLE_BASE_URL || secrets.GOOGLE_BASE_URL }}

jobs:
  examples:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    defaults:
      run:
        working-directory: karels-crypto-solving
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - run: uv sync --frozen

      - name: Export Arnout's attempts (read-only)
        env:
          SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          FIREBASE_PROJECT_ID: ${{ vars.FIREBASE_PROJECT_ID }}
        run: |
          printf '%s' "$SERVICE_ACCOUNT" > "$RUNNER_TEMP/sa.json"
          GOOGLE_APPLICATION_CREDENTIALS="$RUNNER_TEMP/sa.json" \
            uv run --with firebase-admin python scripts/export_human_attempts.py "$RUNNER_TEMP/attempts.json"
          rm -f "$RUNNER_TEMP/sa.json"

      - name: Capture full replies
        env:
          MODELS: ${{ inputs.models }}
        run: |
          uv run karels-crypto-llm-reveal examples \
            --attempts "$RUNNER_TEMP/attempts.json" --models $MODELS

      - uses: actions/upload-artifact@v4
        with:
          name: examples
          path: karels-crypto-solving/research/llm_reveal/examples/*
          retention-days: 7

      - name: Commit results
        run: |
          cd "$GITHUB_WORKSPACE"
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add karels-crypto-solving/research/llm_reveal/examples
          git commit -m "LLM reveal examples (full replies) for the blog" || exit 0
          git pull --rebase origin "${GITHUB_REF_NAME}"
          git push origin "HEAD:${GITHUB_REF_NAME}"
